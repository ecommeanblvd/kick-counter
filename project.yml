name: KickCounter
options:
  bundleIdPrefix: com.lmtiep
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  KickCore:
    path: Packages/KickCore
  KickData:
    path: Packages/KickData
targets:
  KickCounter:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: KickCore
      - package: KickData
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kick Counter
        CFBundleLocalizations: [en, vi]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lmtiep.kickcounter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  KickCounterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: KickCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lmtiep.kickcounter.uitests
schemes:
  KickCounter:
    build:
      targets:
        KickCounter: all
        KickCounterUITests: [test]
    test:
      targets:
        - KickCounterUITests
